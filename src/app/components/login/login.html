<div class="container mt-5">

    <div class="card col-md-4 mx-auto shadow">
    
    <div class="card-header bg-primary text-white">
    
    <h3>Login</h3>
    
    </div>
    
    <div class="card-body">
    
    <div class="mb-3">
    
    <label>Email</label>
    
    <input
    class="form-control"
    [(ngModel)]="email">
    
    </div>
    
    <div class="mb-3">
    
    <label>Password</label>
    
    <input
    type="password"
    class="form-control"
    [(ngModel)]="password">
    
    </div>
    
    <button
    class="btn btn-success w-100"
    (click)="login()">
    
    Login
    
    </button>
    
    <hr>
    
    <p class="text-center">
    
    Don't have an account?
    
    <a routerLink="/register">
    
    Register
    
    </a>
    
    </p>
    
    </div>
    
    </div>
    
    </div>
