<div class="container mt-5">

    <div class="card col-md-5 mx-auto shadow">
    
    <div class="card-header bg-success text-white">
    
    <h3>Register</h3>
    
    </div>
    
    <div class="card-body">
    
    <div class="mb-3">
    
    <label>Name</label>
    
    <input
    class="form-control"
    [(ngModel)]="user.name">
    
    </div>
    
    <div class="mb-3">
    
    <label>Email</label>
    
    <input
    class="form-control"
    [(ngModel)]="user.email">
      <small class="text-danger" *ngIf="message">
        {{ message }}
      </small>
    </div>
    
    <div class="mb-3">
    
    <label>Password</label>
    
    <input
    type="password"
    class="form-control"
    [(ngModel)]="user.password">
    
    </div>
    
    <div class="mb-3">
    
    <label>Role</label>
    
    <select
    class="form-select"
    [(ngModel)]="user.role">
    
    <option>User</option>
    
    <option>Admin</option>
    
    </select>
    
    </div>
    
    <button
    class="btn btn-success w-100"
    (click)="register()">
    
    Register
    
    </button>
    
    <hr>
    
    <p class="text-center">
    
    Already have an account?
    
    <a routerLink="/login">
    
    Login
    
    </a>
    
    </p>
    
    </div>
    
    </div>
    
    </div>
